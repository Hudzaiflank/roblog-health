 orbs.forEach((o,i)=>{const y=Math.sin(t*2+i)*.3;o.core.position.y=o.halo.position.y=o.ring.position.y=2+y;o.ring.rotation.z=t*2;o.halo.scale.setScalar(1+Math.sin(t*3+i)*.1)});
 swings.forEach((s,i)=>s.rotation.x=Math.sin(t*1.6+i)*.4);clouds.forEach(c=>{c.position.x+=dt*1.2;if(c.position.x>120)c.position.x=-120});
 updFx(dt);renderer.render(scene,camera)}
build();rebuildOrbs();loop();
</script></body></html>
